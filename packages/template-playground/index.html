<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slothing — Template Playground</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { margin: 0; display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
      #controls { padding: 1rem; border-right: 1px solid #ddd; overflow: auto; }
      #controls h1 { font-size: 1rem; margin: 0 0 1rem; }
      #controls label { display: block; font-size: 0.78rem; margin: 0.7rem 0 0.2rem; color: #444; }
      #controls select, #controls input { width: 100%; box-sizing: border-box; }
      #controls hr { margin: 1rem 0 0; border: 0; border-top: 1px solid #eee; }
      .panes { display: grid; grid-template-columns: 1fr 1fr; height: 100vh; min-width: 0; }
      .pane { display: flex; flex-direction: column; min-width: 0; border-left: 1px solid #eee; }
      .pane header { padding: 0.5rem 1rem; border-bottom: 1px solid #eee; font-size: 0.78rem; color: #666; }
      iframe { border: 0; width: 100%; height: 100%; background: #fff; flex: 1; }
      .note { font-size: 0.7rem; color: #999; margin-top: 1rem; line-height: 1.4; }
    </style>
  </head>
  <body>
    <div id="controls">
      <h1>Template Playground</h1>
      <div id="form"></div>
      <p class="note">
        Phase 1: real <code>renderHtml</code> + live in-browser <code>renderTypeset</code>
        (Typst WASM). Both panes render the same template definition so HTML vs Typeset
        drift is tunable. Phase 3 adds the original-PDF drag-drop side-by-side.
      </p>
    </div>
    <div class="panes">
      <div class="pane" id="html-pane">
        <header>HTML preview (renderHtml)</header>
        <iframe id="html-frame" title="HTML resume preview"></iframe>
      </div>
      <div class="pane" id="typeset-pane">
        <header id="typeset-status">Typeset PDF (Typst WASM)</header>
        <iframe id="typeset-frame" title="Typeset resume preview"></iframe>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
